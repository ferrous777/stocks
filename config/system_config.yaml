data_source:
  backup_sources:
  - alpha_vantage
  cache_duration_hours: 24
  cache_enabled: true
  primary_source: yahoo
  rate_limit_per_minute: 60

# ── Plaid configuration ──────────────────────────────────────────────────────
# Credentials: store client_id, secret, and fernet_key as env vars in production
# PLAID_CLIENT_ID, PLAID_SECRET, PLAID_FERNET_KEY
# environment: sandbox | development | production
plaid:
  client_id: null
  secret: null
  environment: sandbox
  fernet_key: null
  # Products we request access to
  products:
  - investments
  # Auto-add new equity tickers found in Plaid holdings to the tracked symbol list
  auto_add_symbols: true
  # Default priority for symbols auto-added from Plaid
  auto_add_priority: 2

# ── Alert configuration ───────────────────────────────────────────────────────
alerts:
  enabled: false
  # Confidence floor for new-prediction alerts
  prediction_confidence_threshold: 0.80
  # Fire POSITION_PARAMS_CHANGED when stop/target moves more than this fraction
  parameter_change_pct: 0.05
  # Fire POSITION_PARAMS_CHANGED when confidence drops by more than this (absolute)
  confidence_drop_threshold: 0.15

  email:
    enabled: false
    smtp_host: smtp.gmail.com
    smtp_port: 587
    smtp_user: null
    smtp_password: null
    # Credentials can also be set via ALERT_SMTP_USER / ALERT_SMTP_PASSWORD env vars
    from_address: null
    recipients: []
    # urgent_only: if true, only URGENT severity alerts are emailed immediately;
    # INFO-level alerts are batched into a daily digest
    urgent_immediate: true

  sms:
    enabled: false
    # Set via TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_FROM_NUMBER env vars
    twilio_account_sid: null
    twilio_auth_token: null
    from_number: null
    recipients: []
    # SMS channel only fires URGENT alerts (stop-loss breach, take-profit reached)
    urgent_only: true

  telegram:
    enabled: false
    # Set via TELEGRAM_BOT_TOKEN env var
    bot_token: null
    # List of chat IDs (integer) to send messages to
    chat_ids: []

database:
  backup_enabled: true
  backup_frequency: daily
  compression_enabled: true
  db_path: data/timeseries.db
  retention_days: 365
debug_mode: false
environment: development
log_file: logs/system.log
log_level: INFO
notifications:
  alert_thresholds:
    confidence_threshold: 0.8
    price_change_threshold: 0.05
  email_enabled: false
  email_recipients: null
  enabled: false
  summary_frequency: daily
scheduling:
  analysis_time: '17:00'
  enabled: true
  market_data_time: '16:30'
  skip_holidays: true
  skip_weekends: true
  timezone: US/Eastern
strategies:
- enabled: true
  min_data_points: 60
  name: moving_average_crossover
  parameters:
    long_period: 50
    short_period: 20
  weight: 1.0
- enabled: true
  min_data_points: 30
  name: rsi_divergence
  parameters:
    overbought: 70
    oversold: 30
    period: 14
  weight: 0.8
- enabled: true
  min_data_points: 35
  name: macd
  parameters:
    fast: 12
    signal: 9
    slow: 26
  weight: 0.9
- enabled: true
  min_data_points: 20
  name: volume_price
  parameters:
    price_threshold: 0.02
    volume_threshold: 2.0
  weight: 0.7
