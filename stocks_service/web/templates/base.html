<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Stocks{% endblock %}</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1b1d21; --muted: #626872; --line: #e3e3df;
    --accent: #2f5bd3; --pos: #1d7a4a; --neg: #b3362b; --warn-bg: #fff6e0; --warn-line: #e9c46a;
    --chip: #eef0f4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --panel: #1a1d22; --text: #e7e9ec; --muted: #9aa1ab; --line: #2b3038;
      --accent: #7aa2ff; --pos: #4cc38a; --neg: #ff7b6e; --warn-bg: #2a2416; --warn-line: #8a6d22;
      --chip: #252a32;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--panel); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  .brand { font-weight: 650; }
  nav a { color: var(--muted); text-decoration: none; margin-right: 14px; }
  nav a.on, nav a:hover { color: var(--text); }
  .spacer { flex: 1; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 28px 0 10px; }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  .notice { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 10px; padding: 12px 14px; margin: 14px 0; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-weight: 600; color: var(--muted); font-size: 13px; }
  td.num, th.num { text-align: right; }
  a { color: var(--accent); }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; }
  .long { color: var(--pos); font-weight: 600; } .short { color: var(--neg); font-weight: 600; }
  .exit { color: var(--accent); font-weight: 600; } .hold { color: var(--muted); }
  .pos { color: var(--pos); } .neg { color: var(--neg); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  textarea { width: 100%; min-height: 140px; font: 12px/1.4 ui-monospace, Menlo, monospace; padding: 8px;
             border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); box-sizing: border-box; }
  input[type=text] { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line); }
  button, input[type=password] { font: inherit; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); }
  button { cursor: pointer; }
  svg .line { fill: none; stroke: var(--accent); stroke-width: 1.6; }
</style>
</head>
<body>
<header><div class="bar">
  <span class="brand">Stocks</span>
  {% if request.session.get("user") %}
  <nav>
    <a href="/" class="{{ 'on' if page == 'dashboard' }}">Dashboard</a>
    <a href="/outlook" class="{{ 'on' if page == 'outlook' }}">Outlook</a>
    <a href="/accounts" class="{{ 'on' if page in ('accounts', 'account') }}">Accounts</a>
    <a href="/research" class="{{ 'on' if page == 'research' }}">Research</a>
    <a href="/docs">API</a>
  </nav>
  <span class="spacer"></span>
  <form method="post" action="/logout"><button type="submit">Log out</button></form>
  {% endif %}
</div></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
