{% extends "base.html" %}
{% block title %}Sign in · Stocks{% endblock %}
{% block content %}
<div class="panel" style="max-width:380px;margin:40px auto">
  <h1>Sign in</h1>
  <p class="muted">Open your sign-in link (the bookmark) to sign in. You stay signed in on this device for 90 days.</p>
  <form id="link-form" method="post" action="/login/link" hidden><input type="hidden" name="token"></form>
  {% if password_enabled %}
  <form method="post" action="/login" style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
    <input type="password" name="password" placeholder="Password" required style="flex:1;min-width:160px">
    <button type="submit">Sign in</button>
  </form>
  {% endif %}
  {% if error %}<p class="neg small">{{ error }}</p>{% endif %}
</div>
<script>
  // The sign-in token is in the URL fragment (/login#token), which is never sent to the server or logged.
  (function () {
    var t = location.hash.slice(1);
    if (!t) return;
    history.replaceState(null, "", location.pathname);  // drop it from the address bar and history
    var f = document.getElementById("link-form");
    f.token.value = decodeURIComponent(t);
    f.submit();
  })();
</script>
{% endblock %}
